name: Reproduce baseline analysis
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/analyze.py results/llama-1b-v5e
      - run: python scripts/analyze.py results/llama-1b-v5e-20261018
      - run: python scripts/analyze_sweep.py results/llama-1b-v5e-20261018
      - run: python scripts/analyze_optimization.py results/optimization-20261018
      - run: python scripts/analyze_optimization.py results/optimization-confirm-20261018
